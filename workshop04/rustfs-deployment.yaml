---
apiVersion: v1
kind: Service
metadata:
  name: sts-node-hsvc
  namespace: workshop04
spec:
  # do not give it an IP address
  clusterIP: None
  selector:
    app: sts-rustfs 
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
  - name: web
    port: 9001
    targetPort: 9001

---
apiVersion: v1
kind: Service
metadata:
  name: node0
  namespace: workshop04
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: sts-rustfs-0
  ports:
  - name: s3
    port: 9000
    targetPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: node1
  namespace: workshop04
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: sts-rustfs-1
  ports:
  - name: s3
    port: 9000
    targetPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: node2
  namespace: workshop04
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: sts-rustfs-2
  ports:
  - name: s3
    port: 9000
    targetPort: 9000


---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: sts-rustfs
  namespace: workshop04 
spec:
  #headess service name
  serviceName: sts-node-hsvc
  replicas: 3
  selector:
    matchLabels:
      &pod-labels
      app: sts-rustfs 
  volumeClaimTemplates:
  - metadata: 
      name: data
    spec:
      storageClassName: standard 
      accessModes: [ ReadWriteOncePod ]
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: data1
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: data2
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: node-container
        image: rustfs/rustfs
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: s3
        - containerPort: 9001
          name: web
        env:
        - name: S3_PORT
          valueFrom:
            configMapKeyRef:
              name: rustfs-cm
              key: s3-port
        - name: WEB_PORT
          valueFrom:
            configMapKeyRef:
              name: rustfs-cm
              key: web-port
        - name: RUSTFS_ADDRESS_IP
          valueFrom:
            configMapKeyRef:
              name: rustfs-cm
              key: RUSTFS_ADDRESS_IP
        - name: RUSTFS_CONSOLE_ADDRESS_IP
          valueFrom:
            configMapKeyRef:
              name: rustfs-cm
              key: RUSTFS_CONSOLE_ADDRESS_IP
        - name: RUSTFS_CONSOLE_ENABLE
          valueFrom:
            configMapKeyRef:
              name: rustfs-cm
              key: RUSTFS_CONSOLE_ENABLE
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            configMapKeyRef:
              name: rustfs-cm
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: RUSTFS_SECRET_KEY
        - name: RUSTFS_ADDRESS
          value: "$(RUSTFS_ADDRESS_IP):$(S3_PORT)"
        - name: RUSTFS_CONSOLE_ADDRESS
          value: "$(RUSTFS_CONSOLE_ADDRESS_IP):$(WEB_PORT)"
        - name: RUSTFS_VOLUMES
          value: "http://node{0...2}:9000/data"
        resources:
          requests:
            cpu: 200m
            memory: 250Mi
          limits:
            cpu: 200m
            memory: 250Mi
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: data1
          mountPath: /opt/data1
        - name: data2
          mountPath: /opt/data2
