---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umamidb-pvc
  namespace: workshop03
spec:
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
  accessModes:
  - ReadWriteOnce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamidb-deploy
  namespace: workshop03
spec:
  replicas: 1
  # Deployment's update strategy
  strategy:
    type: Recreate
  selector:
    matchLabels: &umamidb-labels
      app: umami
      tier: data
      env: workshop
  template:
    metadata:
      labels:
        <<: *umamidb-labels
    spec:
      volumes:
      - name: data-vol
        persistentVolumeClaim:
          claimName: umamidb-pvc
      containers:
      - name: umamidb-container
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: umami-cm
        - secretRef:
            name: umami-secret
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data-vol
          mountPath: /var/lib/postgresql/data
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: umamidb-svc
  namespace: workshop03
spec:
  type: ClusterIP
  selector:
    app: umami
    tier: data
    env: workshop
  ports:
  - port: 5432
    targetPort: 5432
