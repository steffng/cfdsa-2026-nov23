---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      &pod-labels
      app: bggapp
      env: dev
      dept: eng
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
        - name: bggapp-pod
          image: stackupiss/bgg-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: bggapp-port
              containerPort: 3000
          env:
            - name: BGG_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: bgg-cm
                  key: BGG_DB_USER
            - name: BGG_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: bgg-cm
                  key: BGG_DB_HOST
            - name: BGG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bgg-secret
                  key: BGG_DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: bggapp-port
            failureThreshold: 3
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: NodePort
  selector:
      app: bggapp
      env: dev
      dept: eng
  ports:
    - port: 8080
      targetPort: bggapp-port