---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggdb-deploy
  namespace: bggns
spec:
  replicas: 1
  selector:
    matchLabels:
      dept: eng
      env: dev
      app: bggdb
  template:
    metadata:
      labels:
        dept: eng
        env: dev
        app: bggdb
    spec:
      containers:
        - name: bggdb-pod
          image: stackupiss/bgg-database:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: bggdb-port
              containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    app: bggdb
  ports:
    - port: 3306
      targetPort: bggdb-port

