---
apiVersion: v1
kind: Namespace
metadata:
  name: bggns
  labels:
    dept: eng
    env: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggdb-deploy
  namespace: bggns
spec:
  replicas: 1
  selector:
    matchLabels:
      dept: eng
      env: dev
      app: bggdb
  template:
    metadata:
      labels:
        dept: eng
        env: dev
        app: bggdb
    spec:
      containers:
        - name: bggdb-pod
          image: stackupiss/bgg-database:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: bggdb-port
              containerPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      dept: eng
      env: dev
      app: bggapp
  template:
    metadata:
      labels:
        dept: eng
        env: dev
        app: bggapp
    spec:
      containers:
        - name: bggapp-pod
          image: stackupiss/bgg-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: bggapp-port
              containerPort: 3000
          env:
            - name: BGG_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: bgg-cm
                  key: BGG_DB_USER
            - name: BGG_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: bgg-cm
                  key: BGG_DB_HOST
            - name: BGG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bgg-secret
                  key: BGG_DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: bggapp-port
            failureThreshold: 3
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    app: bggdb
  ports:
    - port: 3306
      targetPort: bggdb-port

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  # type: ClusterIP
  # type: NodePort # does not work for windows
  type: LoadBalancer
  selector:
    app: bggapp
  ports:
    - port: 3000
      targetPort: bggapp-port