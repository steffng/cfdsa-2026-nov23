--- 
apiVersion: gateway.networking.k8s.io/v1 
kind: Gateway
metadata: 
  name: default-gtw 
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
  - name: web 
    port: 80 
    protocol: HTTP 
    #hostname: '*'
    hostname: '*.nip.io'
    allowedRoutes:
      namespaces:
        from: All
